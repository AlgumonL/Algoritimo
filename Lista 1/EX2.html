<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    Inserir valor de x:<br>
    <input type="text" id="input_x"><br>
    Inserir valor de y:<br>
    <input type="text" id="input_y"><br>


    <button onclick="f()">calcular</button>

    <div id="div_mensagem"></div>

</body>
</html>
<script>
    let media = 0;

    function f(){
        let x = Number(input_x.value);    
        let y = Number(input_y.value);   
        let resultado = ``;
        
        media = (x+y) / 2;
        
        if (media>=5){
            resultado = `Aprovado!!`;
        }else{
            resultado = `Reprovado!! Se esforçe.`;
        }
        
        div_mensagem.innerHTML = `
        A sua média é de : ${media}<br>${resultado}`;
    }


</script>
